<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Un cadeau pour toi, Maman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#8CC63F;
    --green-d:#6FAE2B;
    --blue:#27AAE1;
    --blue-d:#1B8FC4;
    --accent:var(--green);
    --accent2:var(--blue);
    --ink:#33414A;
    --ink-soft:#5d6c75;
    --card:#ffffff;
    --bg1:#eaf7ff;
    --bg2:#f3fbe9;
    --bg3:#fffdf6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 15% 0%, var(--bg2) 0%, transparent 55%),
      radial-gradient(120% 90% at 100% 100%, var(--bg1) 0%, transparent 60%),
      linear-gradient(160deg,var(--bg3),var(--bg1));
  }
  #root{height:100%;}
  .stage{
    position:relative;height:100%;width:100%;
    display:flex;flex-direction:column;
    overflow-x:hidden;overflow-y:auto;
  }
  .spacer{flex:1 1 auto;min-height:24px;}
  .bg-fly{position:fixed;opacity:.5;animation:drift linear infinite;will-change:transform;pointer-events:none;}
  @keyframes drift{
    0%{transform:translateY(8px) rotate(-6deg);}
    50%{transform:translateY(-14px) rotate(6deg);}
    100%{transform:translateY(8px) rotate(-6deg);}
  }
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;}

  .scene{position:relative;width:min(92vw,440px);margin:0 auto;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}

  .card-wrap{position:relative;z-index:5;width:min(92vw,440px);}
  .card-wrap.idle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.82);opacity:0;pointer-events:none;}
  .card{
    position:relative;background:var(--card);border-radius:30px;overflow:hidden;
    box-shadow:0 30px 70px -25px rgba(40,80,110,.45), 0 4px 14px rgba(40,80,110,.10);
    transform-origin:center;
  }
  .card-top{
    position:relative;padding:26px 26px 22px;
    background:
      radial-gradient(140% 120% at 0% 0%, color-mix(in srgb,var(--accent2) 22%,#fff) 0%, transparent 60%),
      linear-gradient(120deg, color-mix(in srgb,var(--accent) 16%,#fff), color-mix(in srgb,var(--accent2) 14%,#fff));
    border-bottom:2px dashed color-mix(in srgb,var(--accent) 40%,#fff);
  }
  .brandline{display:flex;align-items:center;gap:11px;}
  .wordmark{font-family:'Fredoka';font-weight:600;font-size:30px;letter-spacing:-.5px;line-height:1;}
  .wordmark .b{color:var(--blue);}
  .wordmark .g{color:var(--green-d);}
  .subbrand{margin-top:2px;font-family:'Fredoka';font-weight:500;font-size:13px;letter-spacing:.3px;}
  .subbrand .a{color:var(--green-d);}
  .subbrand .b{color:var(--blue-d);}
  .yearstamp{
    position:absolute;top:20px;right:18px;width:74px;height:74px;border-radius:50%;
    background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -6px color-mix(in srgb,var(--accent) 70%,#000);
    transform:rotate(8deg);border:3px solid #fff;
  }
  .yearstamp b{font-family:'Fredoka';font-weight:700;font-size:30px;line-height:.85;}
  .yearstamp span{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}

  .card-body{padding:22px 26px 26px;}
  .kicker{font-family:'Fredoka';font-weight:600;font-size:13px;letter-spacing:.4px;color:var(--accent2);text-transform:uppercase;}
  .headline{font-family:'Fredoka';font-weight:700;font-size:clamp(30px,8.4vw,40px);line-height:1.02;letter-spacing:-1px;margin:6px 0 0;color:var(--ink);}
  .headline em{font-style:normal;color:var(--accent);}
  .tagline{margin:13px 0 0;font-size:15.5px;line-height:1.5;color:var(--ink-soft);font-weight:600;text-wrap:pretty;}

  .phoneshow{
    margin-top:18px;position:relative;border-radius:20px;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 18%, #fff 0%, color-mix(in srgb,var(--accent2) 12%,#fff) 70%, color-mix(in srgb,var(--accent) 16%,#fff) 100%);
    border:1.5px solid color-mix(in srgb,var(--accent2) 20%,#fff);
    padding:14px 16px 12px;text-align:center;
  }
  .phoneshow img{display:block;width:88%;max-width:280px;margin:2px auto 0;filter:drop-shadow(0 14px 16px rgba(30,50,65,.32));transform:rotate(-2deg);}
  .phoneshow .cap{margin-top:6px;font-family:'Fredoka';font-weight:500;font-size:13px;color:var(--ink-soft);}
  .phoneshow .cap b{color:var(--ink);font-weight:600;}

  .mail{
    margin-top:18px;display:flex;gap:13px;align-items:flex-start;
    background:linear-gradient(180deg,#fff, color-mix(in srgb,var(--accent2) 7%,#fff));
    border:1.5px solid color-mix(in srgb,var(--accent2) 22%,#fff);
    border-radius:18px;padding:14px 15px;
  }
  .mail .ic{flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--accent2) 14%,#fff);display:flex;align-items:center;justify-content:center;}
  .mail h3{margin:1px 0 3px;font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--ink);}
  .mail p{margin:0;font-size:13.3px;line-height:1.42;color:var(--ink-soft);font-weight:600;}

  .note{
    margin-top:18px;position:relative;padding:16px 18px 14px;border-radius:16px;
    background:repeating-linear-gradient(180deg, #fffdf4, #fffdf4 26px, #f3ead0 27px, #fffdf4 28px);
    background-color:#fffdf4;border:1.5px solid #efe2bf;
    box-shadow:0 6px 18px -10px rgba(120,100,40,.4);
    transform:rotate(-.6deg);
  }
  .note p{margin:0;font-family:'Caveat';font-weight:600;font-size:23px;line-height:1.28;color:#5a4a2a;}
  .signoff{
    margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-top:2px dashed #e4e9ec;padding-top:14px;
  }
  .signoff .who{font-family:'Fredoka';font-weight:500;font-size:14px;color:var(--ink-soft);}
  .signoff .who b{display:block;font-weight:600;font-size:18px;color:var(--ink);}
  .signoff .heart{font-family:'Caveat';font-size:20px;color:var(--accent);font-weight:700;white-space:nowrap;flex:0 0 auto;}

  .cover{display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;}
  .tap-hint{
    position:absolute;bottom:-46px;left:0;right:0;text-align:center;
    font-family:'Fredoka';font-weight:500;font-size:15px;color:var(--ink-soft);
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(5px);opacity:1}}

  .card-wrap.show{position:relative;opacity:1;transform:scale(1);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.2,.3,1);}

  .gift{position:relative;width:min(74vw,260px);height:min(74vw,260px);cursor:pointer;}
  .gift .base{
    position:absolute;left:8%;right:8%;bottom:0;top:30%;border-radius:14px;
    background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000 18%));
    box-shadow:0 24px 40px -18px rgba(40,80,40,.6), inset 0 -10px 24px rgba(0,0,0,.12);
    transition:transform .6s cubic-bezier(.5,0,.7,.4),opacity .5s ease;
  }
  .gift .vrib{position:absolute;left:46%;right:46%;top:30%;bottom:0;background:rgba(255,255,255,.55);}
  .gift .lid{
    position:absolute;left:0;right:0;top:18%;height:20%;border-radius:12px;
    background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 88%,#fff),color-mix(in srgb,var(--accent) 60%,#000 12%));
    box-shadow:0 10px 18px -8px rgba(0,0,0,.4);transform-origin:center;
    transition:transform .7s cubic-bezier(.5,-0.3,.7,.5),opacity .6s ease;z-index:3;
  }
  .gift .lid .vrib{position:absolute;left:46%;right:46%;top:0;bottom:0;background:rgba(255,255,255,.6);}
  .gift .bow{position:absolute;top:6%;left:50%;transform:translateX(-50%);z-index:4;transition:transform .6s ease,opacity .5s ease;}
  .gift .bow .loop{width:42px;height:34px;border:11px solid var(--accent2);border-radius:60% 60% 50% 50%;display:inline-block;}
  .gift .bow .loop.l{transform:rotate(-26deg) translateX(7px);}
  .gift .bow .loop.r{transform:rotate(26deg) translateX(-7px);}
  .gift .bow .knot{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--accent2) 80%,#000 10%);}
  .gift.open .lid{transform:translateY(-150%) rotate(-16deg);opacity:0;}
  .gift.open .bow{transform:translate(-50%,-220%) rotate(24deg);opacity:0;}
  .gift.open .base{transform:translateY(8%) scale(.96);opacity:0;}
  .gift .glow{position:absolute;inset:18% 8% 0;border-radius:14px;background:radial-gradient(circle at 50% 30%,#fff,transparent 60%);opacity:0;transition:opacity .4s ease;}
  .gift.open .glow{opacity:.9;}

  .env{position:relative;width:min(82vw,320px);height:min(56vw,214px);cursor:pointer;perspective:900px;}
  .env .body{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,#fff,#eef6fb);box-shadow:0 24px 44px -20px rgba(40,80,110,.5);overflow:hidden;}
  .env .pocket{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,#fff),color-mix(in srgb,var(--accent2) 22%,#fff));z-index:4;clip-path:polygon(0 38%,50% 100%,100% 38%,100% 100%,0 100%);}
  .env .flap{position:absolute;left:0;right:0;top:0;height:64%;background:linear-gradient(160deg,color-mix(in srgb,var(--accent2) 32%,#fff),color-mix(in srgb,var(--accent2) 16%,#fff));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s ease .05s;z-index:6;border-radius:12px 12px 0 0;}
  .env .seal{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -3px rgba(0,0,0,.4);transition:opacity .3s ease;border:3px solid #fff;}
  .env .inner-card{position:absolute;left:8%;right:8%;top:14%;bottom:8%;border-radius:9px;background:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.3);z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:transform .6s cubic-bezier(.3,1,.4,1) .25s;}
  .env.open .flap{transform:rotateX(170deg);z-index:2;}
  .env.open .seal{opacity:0;}
  .env.open .inner-card{transform:translateY(-118%) scale(1.02);}

  .flip{width:min(92vw,420px);height:min(82vh,660px);perspective:1400px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.4,.05,.2,1);transform-style:preserve-3d;}
  .flip.open .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;overflow:hidden;}
  .flip-front{
    background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 80%,#fff),color-mix(in srgb,var(--accent2) 78%,#fff));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;
    box-shadow:0 30px 60px -24px rgba(40,90,110,.55);padding:30px;text-align:center;
  }
  .flip-front .ttl{font-family:'Fredoka';font-weight:700;font-size:34px;line-height:1.05;text-shadow:0 2px 6px rgba(0,0,0,.12);}
  .flip-front .sub{font-family:'Caveat';font-weight:600;font-size:24px;opacity:.95;}
  .flip-back{transform:rotateY(180deg);background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  .inner-brand{font-family:'Fredoka';font-weight:600;font-size:18px;color:var(--ink);}

  @media (max-width:560px){
    .card-top{padding:22px 20px 18px;}
    .card-body{padding:20px 20px 22px;}
    .yearstamp{width:64px;height:64px;}
    .yearstamp b{font-size:26px;}
  }
  @media (prefers-reduced-motion:reduce){
    .bg-fly{animation:none;} .tap-hint{animation:none;}
  }
</style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti"></canvas>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
